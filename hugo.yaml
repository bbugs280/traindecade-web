baseURL: https://traindecade.com/
theme: PaperMod

enableRobotsTXT: true

# Multilingual: EN is the default (lands at /), ZH at /zh/
defaultContentLanguage: en
defaultContentLanguageInSubdir: false

languages:
  en:
    label: English
    weight: 1
    title: Train Decade
    params:
      description: "Fitness, health, and body recomposition for men in their 30s, 40s, and 50s — evidence-based training and nutrition, the long game, one decade at a time. No crash cuts, no quick-fix noise. Bilingual English/中文."
      homeInfoParams:
        Title: Train Decade
        Content: >-
          Fitness, health, and body recomposition — the long game, one decade at a time.

          Evidence-based training and nutrition for men in their 30s, 40s, and 50s.
          No crash cuts, no quick-fix noise. Just the methods that actually work,
          explained clearly and tested against the evidence.
  zh:
    label: 中文
    weight: 2
    title: 訓練十年
    contentDir: content-zh
    params:
      description: "為三十至五十多歲男性提供循證健身、健康與身體重組知識——以十年為單位的長期遊戲。沒有速成減脂，沒有速效噱頭。中英雙語。"
      homeInfoParams:
        Title: 訓練十年
        Content: >-
          健身、健康與身體重組——以十年為單位的長期遊戲。

          為三十至五十多歲男性提供循證訓練與營養知識。
          沒有速成減脂，沒有速效噱頭。只有真正有效的方法，
          講解清晰，並經得起證據檢驗。

params:
  description: "Fitness, health, and body recomposition for men in their 30s, 40s, and 50s — evidence-based training and nutrition, the long game, one decade at a time. No crash cuts, no quick-fix noise. Bilingual English/中文."

  defaultTheme: light
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true
  displayFullLangName: true

  # Organization author — fixes JSON-LD "author: null" schema failure.
  # (Neutral brand voice: the site is "Train Decade", a generic publisher.)
  author: Train Decade

  # Favicons (brand mark: jade barbell) — fixes favicon 404 + JSON-LD publisher.logo 404
  assets:
    favicon: "/favicon.ico"
    favicon16x16: "/favicon-16x16.png"
    favicon32x32: "/favicon-32x32.png"
    apple_touch_icon: "/apple-touch-icon.png"
    safari_pinned_tab: "/safari-pinned-tab.svg"
    theme_color: "#3A6B5C"

  # Home hero image (stock photo)
  homeHeroImage: "/images/hero.jpg"

  # Analytics — paste real IDs here once created (see skills/traindecade).
  analytics:
    ga4ID: "G-B2S3J6P8P5"                       # Train Decade GA4 property
    adsensePublisherID: "ca-pub-4696981239521155"  # Train Decade AdSense publisher
    googleSiteVerification: ""                 # e.g. for Google Search Console

  env: production

menus:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
