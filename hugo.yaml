baseURL: https://traindecade.com/
locale: en-us
title: Train Decade
theme: PaperMod

enableRobotsTXT: true

params:
  homeInfoParams:
    Title: Train Decade
    Content: Fitness, health, and body recomposition — the long game, one decade at a time.

  defaultTheme: dark
  ShowReadingTime: true
  ShowPostNavLinks: true
  ShowBreadCrumbs: true
  ShowCodeCopyButtons: true

  # Home hero image (static/images/hero.jpg)
  homeHeroImage: "/images/hero.jpg"

  # Analytics — paste real IDs here once created (see skills/traindecade).
  analytics:
    ga4ID: ""                                  # e.g. G-XXXXXXXXXX
    adsensePublisherID: ""                     # e.g. ca-pub-XXXXXXXXXXX
    googleSiteVerification: ""                 # e.g. for Google Search Console

  # GA4 tag
  env: production

menus:
  main:
    - identifier: posts
      name: Posts
      url: /posts/
      weight: 10
    - identifier: tags
      name: Tags
      url: /tags/
      weight: 20
